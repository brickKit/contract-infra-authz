// The authorization member's system surface (family contract: every authorization member serves it). Only the
// envelope is protobuf; the security records travel as their canonical JSON bytes (D76), each with its digest beside
// it, checked against the JSON Schemas of be-protocol (schemas/security/). Rules: the assembly project's security 03
// and 09a, the component protocol's chapter 08; the member's obligations are in this repository's README.
syntax = "proto3";

package be.authz.v3;

option go_package = "github.com/brickKit/contract-infra-authz/v3/gen/go/be/authz/v3;authzv3";

// ViewService renews the view shards a component holds (security 03, "授权视图与核验"; protocol P8.9-P8.11).
service ViewService {
  // Verify recomputes the caller's view on the primary and answers per shard. Callers: every component, through
  // its SDK, with its service identity; idempotent.
  rpc Verify(VerifyRequest) returns (VerifyResponse);
}

// DefinitionService takes the definitions a component declares (security 09a, "定义：资源、维度、操作与字段").
service DefinitionService {
  // Submit is called by every component at start, before it is ready; the same version with the same definitions
  // is accepted again.
  rpc Submit(SubmitRequest) returns (SubmitResponse);
}

// AccountService answers the identity member before it changes an account's status (security 08, "管理员账号的状态变
// 更"; security 03's two-person rule beyond T_tight).
service AccountService {
  // CheckAccountChange says whether a change of an account's status needs a confirmation and whether the one given
  // holds now; it uses nothing (the confirmation is used when the account status carrying it is applied). Callers:
  // the identity member only; idempotent.
  rpc CheckAccountChange(CheckAccountChangeRequest) returns (CheckAccountChangeResponse);
  // CheckLinkChange says whether the confirmation given holds for a change of an account's link to an employee (a
  // protected operation, security 08 row 21: every link and every end of one needs it). It uses nothing: the
  // confirmation is used when this member applies the link record carrying it from the employee member's watermark
  // stream. Callers: the employee member (mdm/employee) only; idempotent (alpha.6).
  rpc CheckLinkChange(CheckLinkChangeRequest) returns (CheckLinkChangeResponse);
  // Administrators answers which of the accounts hold the authorization admin role now (an employee's termination or
  // the end of a link warns when one does, D62; it never refuses). Callers: the employee member only (alpha.6).
  rpc Administrators(AdministratorsRequest) returns (AdministratorsResponse);
}

// CatalogService answers what the accepted definitions declare for other infrastructure members (alpha.7).
service CatalogService {
  // AttachmentCategories answers every resource type whose current definition declares attachment categories, with
  // its owner component and the categories (security 09a's attachment_categories, canonical JSON), and the catalog's
  // revision; given the revision the caller holds, it answers unchanged when nothing changed. Callers: the attachment
  // member (infra/attachment) only; idempotent (assembly protocol 12: the categories reach the attachment member
  // through this catalog, so a new business component never changes it).
  rpc AttachmentCategories(AttachmentCategoriesRequest) returns (AttachmentCategoriesResponse);
}

message AttachmentCategoriesRequest {
  // The revision the caller holds; empty for none.
  string known_revision = 1;
}

message AttachmentCategoriesResponse {
  string revision = 1;
  // True when known_revision is the current one: resources is then empty.
  bool unchanged = 2;
  repeated ResourceCategories resources = 3;
}

message ResourceCategories {
  string resource_type = 1;
  // The component the resource type is registered to: the only one that may ask for its attachments' credentials.
  string owner_component = 2;
  // The definition's attachment_categories object, as canonical JSON.
  bytes categories_json = 3;
}

service RecoveryService {
  // Sources answers whether this member has applied its sources up to a moment (assembly protocol 15, 6.4: the
  // replay of the sources is applied before the invariants are checked). The first call (since empty) answers the
  // moment on this member's primary clock and asks every watermark source for a pull; later calls pass it back.
  // Callers: the recovery tool (ops/recover) only; idempotent.
  rpc Sources(SourcesRequest) returns (SourcesResponse);
  // ReplayDeferred executes an intent-only revocation that affects the availability of authorization admins, deferred
  // to 6.5: executing it, if no admin is provably available after, it is not executed and the holding it revokes is
  // held for review. Callers: the recovery tool only; idempotent (a record executed already answers reflected).
  rpc ReplayDeferred(ReplayDeferredRequest) returns (ReplayDeferredResponse);
  // Check runs the invariant check on the final state (6.5): every record judged against its sources as a closure
  // would, the subjects under review closed unless authorization admins, then the deployment's admins judged.
  // Callers: the recovery tool only; repeatable.
  rpc Check(CheckRequest) returns (CheckResponse);
}

// RevisionRef is security 09a's RevisionRef.
message RevisionRef {
  string domain = 1;
  string value = 2;
  // Empty when the domain has no epoch.
  string epoch = 3;
  // Empty when the allocator cannot be replaced.
  string instance = 4;
}

// HeldShard names a shard the component holds and the digest of the bytes it received for it.
message HeldShard {
  string shard = 1;
  string digest = 2;
}

message VerifyRequest {
  // The caller's component ID; the member checks it against the caller's certificate (P8.6).
  string component = 1;
  repeated HeldShard held = 2;
  // At least 128 random bits in lowercase hexadecimal; the answer carries it back.
  string nonce = 3;
}

// ShardStatus is a shard's state in an answer.
enum ShardStatus {
  SHARD_STATUS_UNSPECIFIED = 0;
  // The held digest is still the current view.
  SHARD_STATUS_UNCHANGED = 1;
  // A new view is attached.
  SHARD_STATUS_CHANGED = 2;
  // The shard cannot be renewed for now (a closed scope, facts not yet complete): it runs out on its own.
  SHARD_STATUS_CLOSED = 3;
}

message ShardAnswer {
  string shard = 1;
  ShardStatus status = 2;
  // SHARD_STATUS_CHANGED: the canonical bytes of a be.security.view record, without its digest.
  bytes view = 3;
  // SHARD_STATUS_CHANGED: the digest of view (P8.8, record type be.security.view, major 1).
  string digest = 4;
  // UNCHANGED or CHANGED renewed for ordinary reads only (a source watermark between D_src_high and D_src_read):
  // the high-risk validity does not move (P8.11).
  bool read_only = 5;
}

message VerifyResponse {
  // Equal to the request's; an answer with another nonce is discarded.
  string nonce = 1;
  // For audit only (Instant); components never derive validity from it.
  string computed_at = 2;
  // The answering member instance (security 09a).
  string instance = 3;
  // Domain authz.recovery.
  RevisionRef recovery_generation = 4;
  repeated ShardAnswer shards = 5;
}

// Definition is one definition record: the canonical bytes of a be.security.resource_definition or
// be.security.operation_definition, without its digest.
message Definition {
  bytes record = 1;
  // P8.8, with the record type the bytes declare, major 1.
  string digest = 2;
}

message SubmitRequest {
  // The submitting component's ID; it must equal the caller's certificate and every definition's authority.
  string component = 1;
  // The component's exact version.
  string version = 2;
  // Everything the component declares in this version: resources (with their dimensions, fields and attachment
  // categories) and operations.
  repeated Definition definitions = 3;
}

// SubmitStatus is the outcome of a submission as a whole.
enum SubmitStatus {
  SUBMIT_STATUS_UNSPECIFIED = 0;
  SUBMIT_STATUS_ACCEPTED = 1;
  SUBMIT_STATUS_REJECTED = 2;
}

// Rejection says why one definition, or the submission, was refused.
message Rejection {
  // The definition's digest; empty when the reason concerns the whole submission.
  string digest = 1;
  // An error reason of security 09a (for example DEFINITION_OWNER_MISMATCH).
  string reason = 2;
  // A short text for people; never parsed.
  string detail = 3;
}

message SubmitResponse {
  SubmitStatus status = 1;
  // SUBMIT_STATUS_ACCEPTED: the digest of the accepted set (record type be.security.definition_set: the component,
  // the version and the set of the definitions' digests).
  string set_digest = 2;
  // SUBMIT_STATUS_REJECTED: every reason found, not only the first.
  repeated Rejection rejections = 3;
}

message CheckAccountChangeRequest {
  // The account's platform principal.
  string account = 1;
  // The status it would take: active, disabled or security_frozen (security 09a's account_status).
  string target_state = 2;
  // The account's security version the change is made on.
  int64 security_version = 3;
  // Who asks the identity member for the change (the platform principal).
  string requester = 4;
  // A confirmation's ID (be.security.confirmation, its target the account, target_state and target_state_version
  // this change), or empty.
  string confirmation = 5;
  // The identity member's own rule asks for a second person: the requester was admitted on a view whose source has
  // been stale beyond T_tight (security 03, protocol P8.29).
  bool second_person = 6;
}

enum AccountChangeVerdict {
  ACCOUNT_CHANGE_VERDICT_UNSPECIFIED = 0;
  // No confirmation is needed, or the one given holds.
  ACCOUNT_CHANGE_VERDICT_ALLOWED = 1;
  // A confirmation is needed and none was given.
  ACCOUNT_CHANGE_VERDICT_CONFIRMATION_REQUIRED = 2;
  // The confirmation given does not hold (used, expired, another object, the requester's own or the account's own,
  // a confirmer not qualified now), or this change cannot be made now.
  ACCOUNT_CHANGE_VERDICT_REFUSED = 3;
  // Whether the confirmation holds cannot be proven now (its confirmer's eligibility depends on an identity source
  // that has stopped, security 03): nothing is decided; the identity member answers processing
  // (ADMIN_AVAILABILITY_UNPROVABLE, nothing saved) and the caller asks again when the source answers (alpha.4).
  ACCOUNT_CHANGE_VERDICT_UNPROVABLE = 4;
}

message CheckAccountChangeResponse {
  AccountChangeVerdict verdict = 1;
  // Why a confirmation is required (protected: the account holds the authorization admin role; second_person) or
  // why the change is refused; for people and logs, never parsed.
  string reason = 2;
  // The account holds the authorization admin role (a disablement of it alerts as security 08 says).
  bool administrator = 3;
}

message CheckLinkChangeRequest {
  // The employee's ID in the employee member.
  string employee = 1;
  // The account's platform principal.
  string account = 2;
  // link or unlink.
  string action = 3;
  // The employee's version the change is made on: the confirmation binds it.
  int64 employee_version = 4;
  // Who asks the employee member for the change (the platform principal).
  string requester = 5;
  // A confirmation's ID (be.security.confirmation, its target this employee, account, action and employee version),
  // or empty.
  string confirmation = 6;
}

message CheckLinkChangeResponse {
  // ALLOWED: the confirmation holds; CONFIRMATION_REQUIRED: none was given; REFUSED: the one given does not hold
  // (used, expired, another object, the requester's own, the employee's own account, a confirmer not qualified now);
  // UNPROVABLE: whether it holds cannot be proven now, nothing is decided.
  AccountChangeVerdict verdict = 1;
  // Why; for people and logs, never parsed.
  string reason = 2;
}

message AdministratorsRequest {
  // Platform principals, at most 100.
  repeated string accounts = 1;
}

message AdministratorsResponse {
  // Those of the accounts that hold the authorization admin role now (an effective or a held admin holding).
  repeated string administrators = 1;
}

message SourcesRequest {
  // Empty on the first call; then the as_of of the first answer (an Instant on this member's primary clock).
  string since = 1;
}

message SourceState {
  // The source component and its watermark stream.
  string component = 1;
  string stream = 2;
  // The source's alignment state (aligning, aligned, stalled, blocked).
  string state = 3;
  // The watermark is no older than since (be-protocol P9.35): what the source committed before since is applied.
  bool applied = 4;
}

message SourcesResponse {
  // The moment the answer is about: since, or now on the first call.
  string as_of = 1;
  repeated SourceState sources = 2;
  // Every source applied.
  bool all_applied = 3;
}

message ReplayDeferredRequest {
  // The evidence record's canonical bytes, as the evidence store holds them.
  bytes record = 1;
  // The recovery's identity (the run profile's).
  string recovery = 2;
}

message ReplayDeferredResponse {
  // reflected, applied, for_review (not executed: no admin would be provably available; the holding is held),
  // dangling (the record it revokes is gone).
  string outcome = 1;
  string detail = 2;
}

message CheckRequest {
  // The recovery's identity (the run profile's).
  string recovery = 1;
  // The subjects of the records under review (6.2: a signature that does not hold): closed unless they are
  // authorization admins after the replay.
  repeated string review_subjects = 2;
}

message CheckResponse {
  // The deployment's authorization state after the check (operational, recovery_pending, admin_recovery).
  string admin_state = 1;
  // Records the check moved: ended (a source ended or nothing left), held (not computable), marked for review
  // (partly outside their limit).
  int32 ended = 2;
  int32 held = 3;
  int32 review = 4;
  // The review subjects closed (a recovery_review disposition each) and those left open as authorization admins.
  repeated string closed = 5;
  repeated string admins_not_closed = 6;
  // Accounts whose status cannot be proven now: the check judged nothing; call again once the sources are applied.
  repeated string unprovable = 7;
}
